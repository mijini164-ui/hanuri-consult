<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신규 상담 안내문 (주소가 바뀌었어요)</title>
<meta name="robots" content="noindex">
<style>body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fffdf9;color:#1d2747;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}a{color:#e8622c;font-weight:700}</style>
</head>
<body>
<div>
  <p>신규 상담 안내문 주소가 바뀌었어요.</p>
  <p><a id="go" href="https://hanuri-ansandanwon.github.io/consult/">hanuri-ansandanwon.github.io/consult/</a></p>
  <p style="font-size:13px;color:#5d6886">잠시 후 새 주소로 이동해요.</p>
</div>
<script>
/* 이 기기에 적어 둔 내용(consult_v3)을 새 주소로 함께 넘겨요 */
(function () {
  var url = "https://hanuri-ansandanwon.github.io/consult/";
  try {
    var d = localStorage.getItem("consult_v3") || localStorage.getItem("consult_v2");
    if (d) url += "#import=" + encodeURIComponent(btoa(unescape(encodeURIComponent(d))));
  } catch (e) {}
  document.getElementById("go").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
